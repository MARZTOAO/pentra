[package]
name = "gamer-social"
version = "0.1.0"
description = "Pentra — find your group, play tonight."
authors = ["MARZ"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gamer_social_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what lets the app live in the system tray and keep
# receiving notifications while the window is shut.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Self-update from GitHub Releases, and the restart that follows it.
# See src/lib/updater.ts for the flow.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Remembers where the window was and how big, so the app opens the
# way it was closed instead of 1200x800 in the middle every time.
tauri-plugin-window-state = "2"

# Windows toast notifications, so a friend request or a session
# starting reaches you while you are in a game. See src/lib/desktop.ts.
tauri-plugin-notification = "2"

# The optional "start Pentra when I sign in" switch in Settings. Off
# unless somebody turns it on.
tauri-plugin-autostart = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
