name: Sync games catalogue

on:
  schedule:
    # 04:00 UTC daily - the small hours in the US, so a slow run never
    # overlaps with people actually using the app.
    - cron: "0 4 * * *"

  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: sync-games
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The sync script imports exactly one package and uses Node's
      # built-in fetch for the rest. Installing the whole project to run
      # it was needless work - and npm ci on the full lock file is what
      # hung the first time this ran.
      #
      # The step timeout matters: without it, a stuck install eats the
      # job's whole budget before anyone finds out.
      - name: Install the one dependency
        timeout-minutes: 3
        run: npm install --no-save --no-audit --no-fund --loglevel=http @supabase/supabase-js

      - name: Sync
        timeout-minutes: 10
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync-games:ci
