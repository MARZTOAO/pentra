name: Sync games catalogue

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: sync-games
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the code
        timeout-minutes: 3
        uses: actions/checkout@v4

      # No actions/setup-node here on purpose. The runner image already
      # ships with Node, and every version that ships has the two things
      # the sync script needs: ES modules and a built-in fetch. Setting
      # up a specific version means downloading one, and that download
      # is what hung this workflow twice.
      - name: What we are working with
        run: |
          node --version
          npm --version

      - name: Install the one dependency
        timeout-minutes: 3
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js

      - name: Sync
        timeout-minutes: 10
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync-games:ci
